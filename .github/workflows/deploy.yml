name: Deploy to GitHub Pages

# Publishes the repository root (this static site, database chunks included)
# to GitHub Pages on every push to main. No build step is required — the site
# is already static. Rebuild the database only when the data changes, with
# `python3 tools/prepare_db.py --src <csv-dir>`, then commit the result.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
